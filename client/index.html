<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .Landing {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        .Landing h1 {
            font-size: 3rem;
            letter-spacing: 0.15em;
            margin: 0;
        }

        .Landing-cards {
            display: flex;
            gap: 0;
        }

        .Landing-cards img {
            width: 80px;
            transform-origin: bottom center;
        }

        .Landing-cards img:nth-child(1) { transform: rotate(-15deg) translateX(20px); }
        .Landing-cards img:nth-child(2) { transform: rotate(-5deg)  translateX(10px); z-index: 1; }
        .Landing-cards img:nth-child(3) { transform: rotate(5deg)   translateX(-10px); z-index: 1; }
        .Landing-cards img:nth-child(4) { transform: rotate(15deg)  translateX(-20px); }

        .Landing-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 220px;
        }

        .Landing-buttons a {
            display: block;
            text-align: center;
            padding: 12px 0;
            background: #e0d7c6;
            color: #1a1a2e;
            text-decoration: none;
            border-radius: 6px;
            font-size: 1.1rem;
            letter-spacing: 0.08em;
            transition: opacity 0.15s;
        }

        .Landing-buttons a:hover { opacity: 0.8; }

        .Landing-buttons a.secondary {
            background: transparent;
            border: 2px solid #e0d7c6;
            color: #e0d7c6;
        }
    </style>
</head>
<body>
    <div class="Landing">
        <div class="Landing-cards">
            <img src="./playing-cards/back_dark.png">
            <img src="./playing-cards/back_dark.png">
            <img src="./playing-cards/back_dark.png">
            <img src="./playing-cards/back_dark.png">
        </div>

        <h1>Scoundrel</h1>

        <div class="Landing-buttons">
            <a href="./solo/index.html">Solo</a>
            <a href="./multi/index.html" class="secondary">Multiplayer</a>
        </div>
    </div>
</body>
</html>
