openapi: 3.0.3
info:
  title: Card Game API
  version: 1.0.0
  description: |
    Multiplayer card game server. Players create/join rooms, start games, and submit turn actions.

    JWT auth is currently disabled server-side (`AUTH = false`). When enabled, most endpoints
    require a Bearer token obtained from `POST /token`.

servers:
  - url: http://localhost:8080
  - url: https://pweb-lab7.onrender.com

tags:
  - name: Auth
  - name: Room
  - name: Game
  - name: Health

paths:

  /token:
    post:
      tags: [Auth]
      summary: Issue a JWT token
      description: |
        Returns a signed JWT valid for 1 minute. Role `ADMIN` requires `name` to equal the server admin secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [PLAYER, HOST, GUEST, VIEWER, ADMIN]
                name:
                  type: string
                id:
                  type: integer
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        "403":
          description: Wrong admin secret

  /room:
    get:
      tags: [Room]
      summary: List all open rooms
      description: Returns all rooms not yet started. Requires VIEWER or ADMIN role when AUTH is enabled.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Array of rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "401":
          description: Missing or invalid token
        "403":
          description: Insufficient role

  /room/{host}:
    post:
      tags: [Room]
      summary: Create a new room
      description: Creates a room with the caller as host. Returns the new room ID.
      security:
        - bearerAuth: []
      parameters:
        - name: host
          in: path
          required: true
          schema:
            type: string
          description: Username of the host player
      responses:
        "200":
          description: Room created
          content:
            application/json:
              schema:
                type: object
                properties:
                  room_id:
                    type: integer
        "400":
          description: Empty username
        "401":
          description: Missing or invalid token
        "403":
          description: Forbidden

  /room/{id}:
    get:
      tags: [Room]
      summary: Get a room by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Room details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Invalid room ID
        "401":
          description: Missing or invalid token
        "403":
          description: Forbidden
        "404":
          description: Room not found

    delete:
      tags: [Room]
      summary: Delete a room (host only)
      description: Deletes the room and returns the deleted room object.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Room deleted; body is the deleted room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Invalid room ID
        "401":
          description: Missing or invalid token
        "403":
          description: Not the host
        "404":
          description: Room not found

  /room/{guest}/{id}:
    patch:
      tags: [Room]
      summary: Join a room as guest
      description: Assigns the caller as the guest of the specified room.
      security:
        - bearerAuth: []
      parameters:
        - name: guest
          in: path
          required: true
          schema:
            type: string
          description: Username of the guest player
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated room object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Invalid room ID
        "401":
          description: Missing or invalid token
        "403":
          description: Forbidden
        "404":
          description: Room not found

    delete:
      tags: [Room]
      summary: Remove guest from a room
      description: Clears the guest slot. Allowed by the guest themselves, the host, or an admin.
      security:
        - bearerAuth: []
      parameters:
        - name: guest
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Guest removed
        "400":
          description: Invalid room ID
        "401":
          description: Missing or invalid token
        "403":
          description: Forbidden (name mismatch or insufficient role)
        "404":
          description: Room not found

  /game/start/{role}/{id}:
    get:
      tags: [Game]
      summary: Start / join a started game (long-poll)
      description: |
        Both HOST and GUEST must call this endpoint. The call blocks until the other
        player connects (30-second timeout). Once both are connected the game state
        is initialised and returned.

        The HOST's call also moves the room from the lobby into the started-rooms store.
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [HOST, GUEST]
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Room ID
      responses:
        "200":
          description: Game started; initial state returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnResult"
        "400":
          description: Invalid room ID
        "401":
          description: Missing or invalid token
        "403":
          description: Invalid role or forbidden
        "404":
          description: Room not found
        "504":
          description: Other player did not connect within 30 seconds
        "410":
          description: Room was closed while waiting

  /game/{role}/{room_id}:
    post:
      tags: [Game]
      summary: Submit a turn action (long-poll)
      description: |
        Submit the player's action for this turn. The call blocks until the opponent
        also submits their action (30-second timeout), then returns both players'
        updated game states.

        If `ran` is `true` the player runs away from the dungeon — the dungeon cards
        are reshuffled into the deck and four new cards are drawn. No combat occurs
        and the response is returned immediately without waiting for the opponent.
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [HOST, GUEST]
        - name: room_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Action"
      responses:
        "200":
          description: Turn resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnResult"
        "400":
          description: Invalid room ID or malformed body
        "401":
          description: Missing or invalid token
        "403":
          description: Forbidden (invalid role or running away twice in a row)
        "404":
          description: Room not found
        "429":
          description: Action sent before previous turn was resolved
        "504":
          description: Opponent did not respond within 30 seconds
        "410":
          description: Game was ended while waiting

  /game/{role}/{id}:
    delete:
      tags: [Game]
      summary: End / leave a game
      description: Closes the game room and signals both players. Allowed by HOST, GUEST, or ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [HOST, GUEST]
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Room ID
      responses:
        "200":
          description: Game ended
        "400":
          description: Invalid room ID
        "401":
          description: Missing or invalid token
        "403":
          description: Forbidden
        "404":
          description: Game not found

  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Server is up

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Room:
      type: object
      properties:
        Host:
          $ref: "#/components/schemas/PlayerPublic"
        Guest:
          $ref: "#/components/schemas/PlayerPublic"

    PlayerPublic:
      type: object
      properties:
        Name:
          type: string

    Action:
      type: object
      properties:
        toggle_eapon:
          type: boolean
          description: Toggle weapon equipped/unequipped (note — typo in source; field is `toggle_eapon`)
        ran:
          type: boolean
          description: Player chooses to run away from the current dungeon
        clicked_card_index:
          type: integer
          description: Index (0-based) of the dungeon card the player clicked

    TurnResult:
      type: object
      properties:
        new_gamestate:
          $ref: "#/components/schemas/GameRepr"
        op_gamestate:
          $ref: "#/components/schemas/OpGameRepr"
        action_result:
          $ref: "#/components/schemas/ActionResult"

    GameRepr:
      type: object
      description: Full game state visible to the owning player
      properties:
        deck:
          type: integer
          description: Number of cards remaining in the deck
        weapon:
          type: string
          description: Currently held weapon card (e.g. "diamonds7"), empty string if none
        equipped:
          type: boolean
          description: Whether the weapon is currently equipped
        durability:
          type: integer
          description: Last attack value blocked; 0 means weapon is at full durability
        ran:
          type: boolean
          description: Whether the player has already run away this dungeon cycle
        healed:
          type: boolean
          description: Whether the player has already healed this dungeon cycle
        dungeon:
          type: array
          items:
            type: string
          description: Current four dungeon cards (e.g. ["clubs5", "spadesA", ...])
        hp:
          type: integer
          description: Player hit points (max 20)

    OpGameRepr:
      type: object
      description: Limited view of the opponent's state
      properties:
        deck:
          type: integer
          description: Number of cards remaining in opponent's deck
        hp:
          type: integer
          description: Opponent's current hit points
        weapon:
          type: string
          description: Opponent's equipped weapon card string, empty if none
        player_card:
          type: string
          description: Card the opponent played this turn

    ActionResult:
      type: object
      description: Combat outcome for this turn
      properties:
        failed:
          type: boolean
          description: The player's clicked card index was out of bounds
        blocked:
          type: boolean
          description: The opponent's attack was fully blocked by the player's weapon
        defended:
          type: boolean
          description: The player attempted to defend with a weapon (partial block possible)
