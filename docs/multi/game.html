<!DOCTYPE html>
<html>
	<head>
		<script src="../packages/alpine_persist.min.js" > </script>
		<script defer src="../packages/alpine.min.js" > </script>
		<link rel="stylesheet" href="../styles.css">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<script src="game.js"> </script>
		<script src="lobby.js"> </script>

	</head>

	<body>
		<div
			class="Game",
			x-data="{
			save: () => $store.game.save(),
			image: (item) => $store.game.image(item),
			reset: () => $store.game.reset(),
			click_card: (idx) => $store.game.click_card(idx),
			run_away: () => $store.game.run_away(),
			estimate_val: (card) => $store.game.estimate(card)
			}" x-init="
				if ($store.game.dungeon.length == 0) {
					reset()
			} else {
				save()
			}
			" >
			        <button type="button" x-on:click="
						console.log('leaving room');
						$store.lobby.leaveRoom();
						"
				    style="padding: 8px 20px; background:transparent; border: 2px solid #e0d7c6; color:inherit; border-radius:6px; cursor:pointer;">
				    ← Back
				</button>

			<div x-data="{ showRules: false }">
			    <button type="button" x-on:click="showRules = true" style="padding: 8px 20px; background:#e0d7c6; color:#1a1a2e; border:none; cursor:pointer; border-radius:6px;">
			        Rules
			    </button>
			
			    <template x-if="showRules">
			        <div class="Rules-overlay" x-on:click.self="showRules = false">
			            <div class="Rules-modal">
			                <h2>Scoundrel Rules</h2>
			                <button class="Rules-close" x-on:click="showRules = false">✕</button>
			                <div class="Rules-body">
			                    <p><strong>Goal:</strong> Clear the dungeon without dying.</p>
			                    <p><strong>Deck:</strong> Standard deck, red face cards (J/Q/K/A of hearts & diamonds) removed.</p>
			                    <p><strong>Each turn:</strong> Four cards are dealt face-up. Click one to play it. When only one card remains, three new cards are dealt (starting a new turn).</p>
			                    <p><strong>♣ ♠ Clubs & Spades (monsters):</strong> Their value is damage dealt to you. Fight bare-handed to take full damage.</p>
			                    <p><strong>♦ Diamonds (weapons):</strong> Pick up as your equipped weapon. Weapon value blocks monster damage (take 0 if weapon ≥ monster). Each weapon can only block monsters weaker than the last one it blocked.</p>
			                    <p><strong>♥ Hearts (potions):</strong> Heal HP equal to card value, up to 20. Only one potion per room.</p>
			                    <p><strong>Weapon toggle:</strong> Click your weapon card to equip/unequip it before fighting(Equipped by default).</p>
			                    <p><strong>Run away:</strong> Send the room back into the deck(at the bottom, in the same order) and draw a new one. Can only run once per room.</p>
			                    <p><strong>Win:</strong> Exhaust the deck. <strong>Lose:</strong> HP reaches 0 or less.</p>
			                </div>
			            </div>
			        </div>
			    </template>
			</div>
			<template x-if="$store.game.hp>0">

				<div class="Play-area">
					<p x-text="'hp'+$store.game.hp"></p>
					<div class="Top-row">
						<button :disabled="$store.game.dungeon.length < 4" type="button" x-on:click="run_away(); save()">
							<div class="Deck">
								<img src="../playing-cards/back_dark.png">
								<p x-text="`Deck: ${$store.game.deck.length}`" > </p>
								<span> Run away </span>
							</div>
						</button>

						<div class="Dungeon-entities">
							<template x-for="(card,idx) in $store.game.dungeon">
								<button x-on:click="click_card(idx); save()">
									<div style="position:relative; display:inline-block;" 
										x-data="{show: false}"
										@mouseenter="show=true" 
										@mouseleave="show=false">
										<img :src="image(card)">
										<span x-show="show" 
												x-text="estimate_val(card)"
												class="Card-tooltip"
												style="position:absolute; background:black; color:white; padding:4px; z-index:1000;">
										</span>
									</div>
								</button>
							</template>
						</div>
					</div>

					<div class="Player-weapon">
						<p> Weapon:
							<template x-if="$store.game.equipped == true">
								<span> equipped </span>
							</template>
						</p>


						<div class="Weapon-slot">
							<template x-if="$store.game.weapon != null">
								<div>
									<button x-on:click="$store.game.equipped =!$store.game.equipped">
										<img :src="image($store.game.weapon)">
									</button>

									<div class="Durability-stack">
										<template x-for="(card,idx) in $store.game.durability">
											<img :src="image(card)" :style="{
												transform: `translate(-${(idx+1)*40}px, 0px)`,
												zIndex: -(idx+1)
											}">
										</template>
									</div>

								</div>
							</template>
						</div>
					</div>

				</div>
			</template>

			<div class="Lose-screen">
				<template x-if="$store.game.hp<=0">
					<div>
						<p> you lost</p>
						<button type="button" x-on:click="reset(); save()">Try again</button>
					</div>
				</template>
			</div>

			<div class="Win-screen">
				<template x-if="$store.game.hp>0 && $store.game.deck.length == 0 && $store.game.dungeon.length==0">
					<div>
						<p> You Won !!!</p>
						<button type="button" x-on:click="reset(); save()">Play again</button>
					</div>
				</template>
			</div>

		</div>
	</body>

</html>
