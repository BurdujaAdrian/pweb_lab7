<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoundrel PvP</title>
  <script defer src="../packages/alpine.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" x-data="pvpGame()" x-init="init()">
  <!-- Lobby -->
  <template x-if="state === 'lobby'">
    <div class="panel">
      <h2>Scoundrel PvP</h2>
      <div class="lobby-actions">
        <label>Your name
          <input type="text" x-model="name" placeholder="Enter display name">
        </label>
        <button @click="createRoom()" :disabled="!name.trim()">🎮 Create Room</button>
        <div class="divider"></div>
        <label>Room ID to join
          <input type="text" x-model="joinId" placeholder="e.g. 42">
        </label>
        <button @click="joinRoom()" :disabled="!name.trim() || !joinId.trim()">🚪 Join Room</button>
        <p class="error" x-text="error" x-show="error"></p>
      </div>
    </div>
  </template>

  <!-- Waiting for opponent -->
  <template x-if="state === 'waiting'">
    <div class="panel waiting-banner">
      <p x-text="waitMsg"></p>
      <p style="font-size:0.9em; color:#aaa;">Waiting for opponent to join / start…</p>
      <button @click="leaveGame()" class="secondary" style="margin-top:20px;">Leave</button>
    </div>
  </template>

  <!-- Playing / waiting for turn -->
  <template x-if="state === 'playing' || state === 'waiting_turn'">
    <div class="panel">
      <div class="info-bar">
        <span><strong x-text="name"></strong> · <span x-text="role"></span> · Room <span x-text="roomId"></span></span>
        <button @click="leaveGame()" class="secondary" style="padding:4px 10px; font-size:0.8em;">Leave</button>
      </div>

      <div class="board">
        <div class="row opponent-area">
          <div class="deck-info">
            <img src="../playing-cards/back_dark.png" alt="deck">
            <span x-text="'Deck: ' + op.deck"></span>
            <span x-text="'HP: ' + op.hp"></span>
          </div>
          <div class="dungeon-cards">
            <template x-for="i in 4">
              <img src="../playing-cards/back_dark.png" style="width:var(--card-width); transform:rotate(180deg); opacity:0.7;">
            </template>
          </div>
          <div class="weapon-area" style="flex-direction:row-reverse;">
            <span style="font-size:0.8em;">Opponent weapon:</span>
            <template x-if="op.weapon">
              <img :src="cardImage(op.weapon)" style="width:40px; transform:rotate(180deg);">
            </template>
            <template x-if="!op.weapon">
              <span style="color:#aaa;">none</span>
            </template>
            <div x-show="op.played" class="last-played">
              <span style="font-size:0.7em;">Played</span>
              <img :src="cardImage(op.played)" style="width:36px;">
            </div>
          </div>
        </div>

        <hr style="border-color:#333;">

        <div class="row">
          <div class="deck-info">
            <button @click="runAway()" :disabled="state!=='playing' || my.ran || my.dungeon.length < 4" style="background:transparent; border:none; padding:0;">
              <img src="../playing-cards/back_dark.png" alt="deck">
            </button>
            <span x-text="'Deck: ' + my.deck"></span>
            <span x-text="'HP: ' + my.hp"></span>
            <button @click="runAway()" :disabled="state!=='playing' || my.ran || my.dungeon.length < 4" style="font-size:0.75em; padding:4px 8px;" class="secondary">Run</button>
          </div>

          <div class="dungeon-cards">
            <template x-for="(cardStr, idx) in my.dungeon">
              <button class="dungeon-card" @click="clickCard(idx)" :disabled="state !== 'playing'" >
                <img :src="cardImage(cardStr)">
              </button>
            </template>
          </div>
        </div>

        <div class="row">
          <div class="weapon-area">
            <span>My weapon:</span>
            <template x-if="my.weapon">
              <div style="display:flex; align-items:center;">
                <img :src="cardImage(my.weapon)" class="weapon-img" @click="toggleWeapon()">
                <span x-show="my.equipped" style="color:lime; margin-left:6px;">✔ Equipped</span>
                <span x-show="!my.equipped" style="color:#ff6666; margin-left:6px;">❌ Unequipped</span>
              </div>
            </template>
            <template x-if="!my.weapon"> <span style="color:#aaa;">none</span> </template>
            <div class="durability-stack" x-show="my.durability.length">
              <template x-for="(c, i) in my.durability">
                <img :src="cardImage(c)" :style="'margin-left:-20px; z-index:' + (i+1)">
              </template>
            </div>
          </div>
        </div>
      </div>

      <!-- Game over overlay -->
      <div x-show="gameOver" class="game-over-overlay">
        <div class="game-over-box">
          <h2 x-text="outcomeText"></h2>
          <p>Final HP: <span x-text="my.hp"></span> · Opponent HP: <span x-text="op.hp"></span></p>
          <button @click="resetToLobby()" class="secondary">🔄 Play Again</button>
        </div>
      </div>

      <div x-show="state==='waiting_turn'" style="text-align:center; color:var(--gold); margin-top:12px;">
        ⏳ Waiting for opponent...
      </div>
      <p class="error" x-text="error" x-show="error"></p>
    </div>
  </template>

  <!-- Result -->
  <template x-if="state === 'result'">
    <div class="panel result-screen">
      <h2 x-text="outcomeText"></h2>
      <p style="margin-bottom:20px;">Final HP: <span x-text="my.hp"></span> · Opponent HP: <span x-text="op.hp"></span></p>
      <button @click="resetToLobby()">🔄 Play Again</button>
      <p class="error" x-text="error" x-show="error"></p>
    </div>
  </template>
</div>

<script src="game.js"></script>
</body>
</html>
