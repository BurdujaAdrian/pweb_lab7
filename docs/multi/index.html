<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles.css">
    <script src="../packages/alpine.min.js" defer></script>
    <script src="lobby.js"> </script>
</head>
<body>
    <div class="Play-area" x-data>
        <div class="Top-row" style="flex-direction: column; align-items:center; gap: 24px;">

            <h1 style="letter-spacing: 0.15em; margin:0;">Lobby</h1>

            <div style="display:flex; gap:8px;">
                <input
                    type="text"
                    placeholder="Your name"
                    x-model="$store.lobby.username"
                    style="padding: 8px 12px; border-radius:6px; border: 2px solid #e0d7c6; background:transparent; color:inherit; font-size:1rem;">
                <button
                    type="button"
                    x-on:click="$store.lobby.createRoom()"
                    :disabled="!$store.lobby.username"
                    style="padding: 8px 20px; background:#e0d7c6; color:#1a1a2e; border:none; cursor:pointer; border-radius:6px;">
                    Create Room
                </button>
            </div>

            <div style="display:flex; flex-direction:column; gap:8px; width:320px;">
                <template x-if="$store.lobby.entries().length === 0">
                    <p style="text-align:center; opacity:0.5;">No open rooms</p>
                </template>

                <template x-for="({id, room}) in $store.lobby.entries()" :key="id">
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border: 2px solid #e0d7c6; border-radius:6px;">
                        <span x-text="room.Host.Name + `'s room`"></span>
                        <button
                            type="button"
                            :disabled="$store.lobby.isFull(room) || !$store.lobby.username || $store.lobby.username === room.Host.Name"
                            x-on:click="$store.lobby.joinRoom(id, room.Host.Name)"
                            x-text="$store.lobby.isFull(room) ? 'Full' : 'Join'"
                            style="padding: 6px 14px; background:#e0d7c6; color:#1a1a2e; border:none; cursor:pointer; border-radius:6px;">
                        </button>
                    </div>
                </template>
            </div>

        <button type="button" x-on:click="$store.lobby.leaveRoom()"
            style="padding: 8px 20px; background:transparent; border: 2px solid #e0d7c6; color:inherit; border-radius:6px; cursor:pointer;">
            ← Back
        </button>

        </div>
    </div>
</body>
</html>
